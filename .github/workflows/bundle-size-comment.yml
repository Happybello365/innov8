name: Bundle Size PR Comment

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  update-comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download bundle size report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bundle-size-report
          path: ${{ runner.temp }}/bundle-size-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create or update bundle size comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ runner.temp }}/bundle-size-report/bundle-size-report.json
          PULL_REQUEST_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const fs = require("node:fs/promises");
            const marker = "<!-- innov8-bundle-size-report -->";
            const report = JSON.parse(await fs.readFile(process.env.REPORT_PATH, "utf8"));

            for (const key of ["current", "baseline"]) {
              const size = report[key];
              if (
                !size ||
                !Number.isSafeInteger(size.chunks) ||
                size.chunks < 1 ||
                !Number.isSafeInteger(size.rawBytes) ||
                size.rawBytes < 0 ||
                !Number.isSafeInteger(size.gzipBytes) ||
                size.gzipBytes < 0
              ) {
                throw new Error(`Invalid ${key} bundle size report`);
              }
            }
            for (const key of ["currentRevision", "baselineRevision"]) {
              if (typeof report[key] !== "string" || !/^[a-f0-9]{40}$/i.test(report[key])) {
                throw new Error(`Invalid ${key} in bundle size report`);
              }
            }
            if (report.deltaGzipBytes !== report.current.gzipBytes - report.baseline.gzipBytes) {
              throw new Error("Bundle size report delta does not match its measurements");
            }

            const formatBytes = (bytes) => `${(bytes / 1024).toFixed(1)} KiB`;
            const delta = report.deltaGzipBytes;
            const deltaLabel = `${delta > 0 ? "+" : ""}${formatBytes(delta)}`;
            const percentage = report.baseline.gzipBytes
              ? ` (${delta > 0 ? "+" : ""}${((delta / report.baseline.gzipBytes) * 100).toFixed(1)}%)`
              : "";
            const body = [
              marker,
              "### JavaScript bundle size",
              "",
              `Gzipped client chunks: **${formatBytes(report.current.gzipBytes)}** (${report.current.chunks} chunks), **${deltaLabel}${percentage}** vs base (${formatBytes(report.baseline.gzipBytes)}).`,
              `Uncompressed total: ${formatBytes(report.current.rawBytes)}; base: ${formatBytes(report.baseline.rawBytes)}.`,
              "",
              `Compared PR \`${report.currentRevision.slice(0, 7)}\` with base \`${report.baselineRevision.slice(0, 7)}\`.`,
            ].join("\n");
            const issue_number = Number(process.env.PULL_REQUEST_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) {
              throw new Error("Invalid pull request number");
            }
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
