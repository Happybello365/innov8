name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary-traffic-controls:
    name: Canary traffic controls (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: backend
            health_path: /health
          - stack: frontend
            health_path: /
    steps:
      - uses: actions/checkout@v4

      - name: Validate canary configuration
        env:
          CANARY_STEPS: ${{ vars.CANARY_STEPS || '10,25,50,100' }}
          CANARY_ERROR_RATE_THRESHOLD: ${{ vars.CANARY_ERROR_RATE_THRESHOLD || '5' }}
          CANARY_LATENCY_MS_THRESHOLD: ${{ vars.CANARY_LATENCY_MS_THRESHOLD || '800' }}
          CANARY_HEALTH_PATH: ${{ matrix.health_path }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Validate staged traffic percentages: comma-separated, ascending, 1-100.
          IFS=',' read -ra STEPS <<< "$CANARY_STEPS"
          [ "${#STEPS[@]}" -ge 2 ] || fail "CANARY_STEPS must define at least two stages"
          prev=0
          for step in "${STEPS[@]}"; do
            [[ "$step" =~ ^[0-9]+$ ]] || fail "CANARY_STEPS contains non-numeric value: $step"
            [ "$step" -ge 1 ] && [ "$step" -le 100 ] || fail "CANARY_STEPS value out of range: $step"
            [ "$step" -gt "$prev" ] || fail "CANARY_STEPS must be strictly ascending: $step after $prev"
            prev="$step"
          done
          [ "$prev" -eq 100 ] || fail "CANARY_STEPS must end at 100 (got $prev)"

          # Validate rollback thresholds.
          [[ "$CANARY_ERROR_RATE_THRESHOLD" =~ ^[0-9]+([.][0-9]+)?$ ]] || fail "CANARY_ERROR_RATE_THRESHOLD must be numeric"
          awk -v v="$CANARY_ERROR_RATE_THRESHOLD" 'BEGIN { exit !(v > 0 && v <= 100) }' || fail "CANARY_ERROR_RATE_THRESHOLD must be in (0,100]"
          [[ "$CANARY_LATENCY_MS_THRESHOLD" =~ ^[0-9]+$ ]] || fail "CANARY_LATENCY_MS_THRESHOLD must be an integer"
          [ "$CANARY_LATENCY_MS_THRESHOLD" -gt 0 ] || fail "CANARY_LATENCY_MS_THRESHOLD must be positive"
          [[ "$CANARY_HEALTH_PATH" == /* ]] || fail "CANARY_HEALTH_PATH must start with '/'"

          echo "Canary config valid for ${{ matrix.stack }}: steps=$CANARY_STEPS error_rate<=$CANARY_ERROR_RATE_THRESHOLD% latency<=${CANARY_LATENCY_MS_THRESHOLD}ms health=$CANARY_HEALTH_PATH"

      - name: Evaluate rollback criteria
        env:
          CANARY_ERROR_RATE_THRESHOLD: ${{ vars.CANARY_ERROR_RATE_THRESHOLD || '5' }}
          CANARY_LATENCY_MS_THRESHOLD: ${{ vars.CANARY_LATENCY_MS_THRESHOLD || '800' }}
          OBSERVED_ERROR_RATE: ${{ vars.CANARY_OBSERVED_ERROR_RATE || '0' }}
          OBSERVED_LATENCY_MS: ${{ vars.CANARY_OBSERVED_LATENCY_MS || '0' }}
        run: |
          set -euo pipefail
          rollback=0
          if awk -v o="$OBSERVED_ERROR_RATE" -v t="$CANARY_ERROR_RATE_THRESHOLD" 'BEGIN { exit !(o > t) }'; then
            echo "::warning::Error rate $OBSERVED_ERROR_RATE% exceeds threshold $CANARY_ERROR_RATE_THRESHOLD%"
            rollback=1
          fi
          if [ "$OBSERVED_LATENCY_MS" -gt "$CANARY_LATENCY_MS_THRESHOLD" ]; then
            echo "::warning::Latency ${OBSERVED_LATENCY_MS}ms exceeds threshold ${CANARY_LATENCY_MS_THRESHOLD}ms"
            rollback=1
          fi
          if [ "$rollback" -eq 1 ]; then
            echo "::error::Rollback criteria met for ${{ matrix.stack }}; aborting promotion"
            exit 1
          fi
          echo "Rollback criteria satisfied for ${{ matrix.stack }}"
