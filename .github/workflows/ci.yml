name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary-traffic-controls:
    name: Canary traffic controls (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: backend
            health_path: /health
          - stack: frontend
            health_path: /
    steps:
      - uses: actions/checkout@v4

      - name: Validate canary configuration
        env:
          CANARY_STEPS: ${{ vars.CANARY_STEPS || '10,25,50,100' }}
          CANARY_ERROR_RATE_THRESHOLD: ${{ vars.CANARY_ERROR_RATE_THRESHOLD || '5' }}
          CANARY_LATENCY_MS_THRESHOLD: ${{ vars.CANARY_LATENCY_MS_THRESHOLD || '800' }}
          CANARY_HEALTH_PATH: ${{ matrix.health_path }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Validate staged traffic percentages: comma-separated, ascending, 1-100.
          IFS=',' read -ra STEPS <<< "$CANARY_STEPS"
          [ "${#STEPS[@]}" -ge 2 ] || fail "CANARY_STEPS must define at least two stages"
          prev=0
          for step in "${STEPS[@]}"; do
            [[ "$step" =~ ^[0-9]+$ ]] || fail "CANARY_STEPS contains non-numeric value: $step"
            [ "$step" -ge 1 ] && [ "$step" -le 100 ] || fail "CANARY_STEPS value out of range: $step"
            [ "$step" -gt "$prev" ] || fail "CANARY_STEPS must be strictly ascending: $step after $prev"
            prev="$step"
          done
          [ "$prev" -eq 100 ] || fail "CANARY_STEPS must end at 100 (got $prev)"

          # Validate rollback thresholds.
          [[ "$CANARY_ERROR_RATE_THRESHOLD" =~ ^[0-9]+([.][0-9]+)?$ ]] || fail "CANARY_ERROR_RATE_THRESHOLD must be numeric"
          awk -v v="$CANARY_ERROR_RATE_THRESHOLD" 'BEGIN { exit !(v > 0 && v <= 100) }' || fail "CANARY_ERROR_RATE_THRESHOLD must be in (0,100]"
          [[ "$CANARY_LATENCY_MS_THRESHOLD" =~ ^[0-9]+$ ]] || fail "CANARY_LATENCY_MS_THRESHOLD must be an integer"
          [ "$CANARY_LATENCY_MS_THRESHOLD" -gt 0 ] || fail "CANARY_LATENCY_MS_THRESHOLD must be positive"
          [[ "$CANARY_HEALTH_PATH" == /* ]] || fail "CANARY_HEALTH_PATH must start with '/'"

          echo "Canary config valid for ${{ matrix.stack }}: steps=$CANARY_STEPS error_rate<=$CANARY_ERROR_RATE_THRESHOLD% latency<=${CANARY_LATENCY_MS_THRESHOLD}ms health=$CANARY_HEALTH_PATH"

      - name: Evaluate rollback criteria
        env:
          CANARY_ERROR_RATE_THRESHOLD: ${{ vars.CANARY_ERROR_RATE_THRESHOLD || '5' }}
          CANARY_LATENCY_MS_THRESHOLD: ${{ vars.CANARY_LATENCY_MS_THRESHOLD || '800' }}
          OBSERVED_ERROR_RATE: ${{ vars.CANARY_OBSERVED_ERROR_RATE || '0' }}
          OBSERVED_LATENCY_MS: ${{ vars.CANARY_OBSERVED_LATENCY_MS || '0' }}
        run: |
          set -euo pipefail
          rollback=0
          if awk -v o="$OBSERVED_ERROR_RATE" -v t="$CANARY_ERROR_RATE_THRESHOLD" 'BEGIN { exit !(o > t) }'; then
            echo "::warning::Error rate $OBSERVED_ERROR_RATE% exceeds threshold $CANARY_ERROR_RATE_THRESHOLD%"
            rollback=1
          fi
          if [ "$OBSERVED_LATENCY_MS" -gt "$CANARY_LATENCY_MS_THRESHOLD" ]; then
            echo "::warning::Latency ${OBSERVED_LATENCY_MS}ms exceeds threshold ${CANARY_LATENCY_MS_THRESHOLD}ms"
            rollback=1
          fi
          if [ "$rollback" -eq 1 ]; then
            echo "::error::Rollback criteria met for ${{ matrix.stack }}; aborting promotion"
            exit 1
          fi
          echo "Rollback criteria satisfied for ${{ matrix.stack }}"

  digest-promotion:
    name: Digest promotion (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: backend
            image: ghcr.io/${{ github.repository }}/backend
          - stack: frontend
            image: ghcr.io/${{ github.repository }}/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Validate digest promotion configuration
        env:
          SOURCE_IMAGE: ${{ matrix.image }}
          SOURCE_DIGEST: ${{ vars.PROMOTE_SOURCE_DIGEST || '' }}
          TARGET_ENVIRONMENT: ${{ vars.PROMOTE_TARGET_ENVIRONMENT || 'staging' }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Promotion must reference an immutable digest, never a mutable tag.
          [ -n "$SOURCE_IMAGE" ] || fail "SOURCE_IMAGE must be set"
          [[ "$SOURCE_IMAGE" != *:*@* ]] || fail "SOURCE_IMAGE must not combine a tag with a digest"
          [[ "$SOURCE_IMAGE" != *:latest ]] || fail "SOURCE_IMAGE must not use the mutable 'latest' tag"

          if [ -z "$SOURCE_DIGEST" ]; then
            echo "::warning::PROMOTE_SOURCE_DIGEST is not set; skipping digest promotion for ${{ matrix.stack }}"
            echo "promotion_skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Digest must be a sha256 content digest: sha256:<64 hex chars>.
          [[ "$SOURCE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || fail "SOURCE_DIGEST must be an immutable sha256 digest (sha256:<64 hex>), got: $SOURCE_DIGEST"

          # Target environment must be a known, non-production-by-default environment.
          [[ "$TARGET_ENVIRONMENT" =~ ^[a-z][a-z0-9-]*$ ]] || fail "TARGET_ENVIRONMENT must be a lowercase environment name"

          echo "Digest promotion valid for ${{ matrix.stack }}: ${SOURCE_IMAGE}@${SOURCE_DIGEST} -> ${TARGET_ENVIRONMENT}"

      - name: Record promoted digest
        if: ${{ vars.PROMOTE_SOURCE_DIGEST != '' }}
        env:
          SOURCE_IMAGE: ${{ matrix.image }}
          SOURCE_DIGEST: ${{ vars.PROMOTE_SOURCE_DIGEST }}
          TARGET_ENVIRONMENT: ${{ vars.PROMOTE_TARGET_ENVIRONMENT || 'staging' }}
        run: |
          set -euo pipefail
          # Emit the immutable reference used for promotion; never echo secrets.
          echo "Promoting ${SOURCE_IMAGE}@${SOURCE_DIGEST} to ${TARGET_ENVIRONMENT}"
          {
            echo "### Digest promotion: ${{ matrix.stack }}"
            echo ""
            echo "- Image: \`${SOURCE_IMAGE}\`"
            echo "- Digest: \`${SOURCE_DIGEST}\`"
            echo "- Target environment: \`${TARGET_ENVIRONMENT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deployment-provenance:
    name: Deployment provenance (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: backend
            image: ghcr.io/${{ github.repository }}/backend
          - stack: frontend
            image: ghcr.io/${{ github.repository }}/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment provenance
        env:
          SOURCE_IMAGE: ${{ matrix.image }}
          SOURCE_DIGEST: ${{ vars.PROMOTE_SOURCE_DIGEST || '' }}
          TARGET_ENVIRONMENT: ${{ vars.PROMOTE_TARGET_ENVIRONMENT || 'staging' }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_WORKFLOW: ${{ github.workflow }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEPLOY_OPERATOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Provenance is only required for production deployments.
          if [ "$TARGET_ENVIRONMENT" != "production" ]; then
            echo "::notice::Skipping provenance record for non-production environment: $TARGET_ENVIRONMENT"
            exit 0
          fi

          # Every production deployment must be traceable to an immutable artifact.
          [ -n "$SOURCE_DIGEST" ] || fail "PROMOTE_SOURCE_DIGEST is required for production deployments"
          [[ "$SOURCE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || fail "SOURCE_DIGEST must be an immutable sha256 digest (sha256:<64 hex>), got: $SOURCE_DIGEST"
          [[ "$DEPLOY_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]] || fail "DEPLOY_COMMIT_SHA must be a full 40-char commit SHA, got: $DEPLOY_COMMIT_SHA"
          [ -n "$DEPLOY_WORKFLOW" ] || fail "DEPLOY_WORKFLOW must be set"
          [ -n "$DEPLOY_RUN_ID" ] || fail "DEPLOY_RUN_ID must be set"
          [ -n "$DEPLOY_OPERATOR" ] || fail "DEPLOY_OPERATOR must be set"

          echo "Provenance valid for ${{ matrix.stack }}: commit=$DEPLOY_COMMIT_SHA workflow=$DEPLOY_WORKFLOW run=$DEPLOY_RUN_ID operator=$DEPLOY_OPERATOR digest=$SOURCE_DIGEST"

      - name: Record deployment provenance
        if: ${{ (vars.PROMOTE_TARGET_ENVIRONMENT || 'staging') == 'production' }}
        env:
          SOURCE_IMAGE: ${{ matrix.image }}
          SOURCE_DIGEST: ${{ vars.PROMOTE_SOURCE_DIGEST }}
          TARGET_ENVIRONMENT: ${{ vars.PROMOTE_TARGET_ENVIRONMENT || 'staging' }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_WORKFLOW: ${{ github.workflow }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEPLOY_OPERATOR: ${{ github.actor }}
          DEPLOY_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Emit a structured provenance record; never echo secrets or PII.
          {
            echo "### Deployment provenance: ${{ matrix.stack }}"
            echo ""
            echo "- Environment: \`${TARGET_ENVIRONMENT}\`"
            echo "- Commit: \`${DEPLOY_COMMIT_SHA}\`"
            echo "- Ref: \`${DEPLOY_REF}\`"
            echo "- Workflow: \`${DEPLOY_WORKFLOW}\`"
            echo "- Run: \`${DEPLOY_RUN_ID}\` (attempt ${DEPLOY_RUN_ATTEMPT})"
            echo "- Operator: \`${DEPLOY_OPERATOR}\`"
            echo "- Image: \`${SOURCE_IMAGE}\`"
            echo "- Artifact digest: \`${SOURCE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
