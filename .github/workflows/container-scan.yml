name: Container Scan

# Trivy scanning for container images and IaC (issue #206).
# Blocks merge on fixable CRITICAL CVEs in the third-party base images the
# project runs, and on HIGH/CRITICAL IaC misconfiguration. Exceptions live in
# .trivyignore with a `# expires: YYYY-MM-DD` marker per entry.
#
# Supply-chain provenance (issue #560): the `provenance` job generates SLSA
# build provenance for the scanned image digests and publishes it as a signed
# attestation artifact. The `verify-provenance` job re-verifies the attestation
# and fails closed on any mismatch before the digests are treated as trusted.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/container-scan.yml"
      - ".trivyignore"
      - "docker-compose.yml"
      - "infra/**"
      - "**/Dockerfile"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/container-scan.yml"
      - ".trivyignore"
      - "docker-compose.yml"
      - "infra/**"
      - "**/Dockerfile"
  schedule:
    # Weekly — Monday 06:30 UTC.
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  trivyignore-expiry:
    name: Validate .trivyignore expiry markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - run: node scripts/check-trivyignore-expiry.mjs

  image-scan:
    name: Image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: trivyignore-expiry
    strategy:
      fail-fast: false
      matrix:
        # Third-party base images the compose/k8s stacks run.
        image:
          - postgres:17-alpine
          - redis:7-alpine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Trivy image scan — block on fixable CRITICAL
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # 0.28.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          output: trivy-${{ strategy.job-index }}.txt

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trivy-image-${{ strategy.job-index }}
          path: trivy-${{ strategy.job-index }}.txt
          retention-days: 30

  iac-scan:
    name: IaC misconfig scan (compose + k8s)
    runs-on: ubuntu-latest
    needs: trivyignore-expiry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Trivy config scan — compose
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # 0.28.0
        with:
          scan-type: config
          scan-ref: docker-compose.yml
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Trivy config scan — k8s manifests
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # 0.28.0
        with:
          scan-type: config
          scan-ref: infra/k8s
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

  provenance:
    name: Generate SLSA provenance
    runs-on: ubuntu-latest
    needs: trivyignore-expiry
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:17-alpine
          - redis:7-alpine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Resolve image digest
        id: digest
        run: |
          set -euo pipefail
          ref="${{ matrix.image }}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const m=JSON.parse(d);if(!m.digest){console.error("missing digest");process.exit(1);}process.stdout.write(m.digest);})')
          if [ -z "$digest" ]; then
            echo "::error::Could not resolve digest for $ref"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c  # v1
        with:
          subject-name: ${{ steps.digest.outputs.ref }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: false

      - name: Upload provenance bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: provenance-${{ strategy.job-index }}
          path: |
            *.intoto.jsonl
          if-no-files-found: error
          retention-days: 90

  verify-provenance:
    name: Verify provenance attestation
    runs-on: ubuntu-latest
    needs: provenance
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download provenance bundles
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4
        with:
          pattern: provenance-*
          path: provenance
          merge-multiple: true

      - name: Verify attestation (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(provenance/*.intoto.jsonl)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error::No provenance bundles found — refusing to trust artifacts"
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            echo "Verifying $bundle"
            gh attestation verify "$bundle" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/container-scan.yml" \
              || { echo "::error::Provenance verification failed for $bundle"; exit 1; }
          done
          echo "All provenance attestations verified."

  posture-report:
    name: Image posture report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: trivyignore-expiry
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Full posture scan (all severities, JSON)
        run: |
          mkdir -p security-reports
          for img in postgres:17-alpine redis:7-alpine; do
            safe=$(echo "$img" | tr '/:' '__')
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --quiet --format json --output "/dev/stdout" "$img" \
              > "security-reports/${safe}.json" || true
          done
          ls -la security-reports

      - name: Upload posture report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: container-posture-report
          path: security-reports/
          retention-days: 90
