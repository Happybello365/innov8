apiVersion: v1
kind: ConfigMap
metadata:
  name: db-backup-config
  namespace: innov8
data:
  S3_PREFIX: "backups"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup-daily
  namespace: innov8
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: db-backup
              image: ghcr.io/kingfrankhood/innov8/db-backup:latest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command: ["/scripts/db-backup.sh", "--type=daily"]
              env:
                - name: GNUPGHOME
                  value: /tmp/gnupg
              envFrom:
                - secretRef:
                    name: db-backup-secret
                - configMapRef:
                    name: db-backup-config
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
---
