apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: default
  labels:
    app: frontend
spec:
  # Keep at least one frontend pod serving during voluntary disruptions
  # (node drains, cluster upgrades). Deployment replicas is 2, so a drain can
  # still evict one pod at a time.
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
